name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build portable exe
        run: npm run dist:win
      - name: Smoke test (packaged app on Windows)
        run: node test/electron/smoke.mjs
        env:
          APP_EXE: dist/win-unpacked/bukatsu-taikai.exe
      - uses: actions/upload-artifact@v4
        with:
          name: bukatsu-taikai-windows
          path: dist/*.exe
          if-no-files-found: error
      - name: Attach exe to release (tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.exe --title "$GITHUB_REF_NAME" --generate-notes || gh release upload "$GITHUB_REF_NAME" dist/*.exe --clobber
